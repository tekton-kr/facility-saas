[build]
  command = "npm run build"
  publish = "dist"

# /api 로 시작하는 요청은 전부 API 서버로 넘긴다. 이 규칙이 없으면
# 배포 사이트가 HTML 404를 돌려주고, 프론트는 JSON이 아니라고 본다.
[[redirects]]
  from = "/api/*"
  to = "https://saas-api.tekton.co.kr/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
